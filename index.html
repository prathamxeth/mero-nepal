<!DOCTYPE html>
<html lang="en" class="h-full antialiased">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mero Nepal — Deluxe Saloon</title>
  <meta name="description" content="Mero Nepal — Iconic Nepali bangers playing live at the saloon.">
  <link rel="icon" type="image/png" href="ChatGPT%20Image%20Aug%2011,%202026,%2003_02_23%20AM.png">
  <link rel="apple-touch-icon" href="ChatGPT%20Image%20Aug%2011,%202026,%2003_02_23%20AM.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Silently suppress non-fatal third-party Spotify CDN internal logs
    (function() {
      const origWarn = console.warn;
      const origError = console.error;
      console.warn = function(...args) {
        const msg = args.join(' ');
        if (msg.includes('robustness level') || msg.includes('Allow attribute')) return;
        origWarn.apply(console, args);
      };
      console.error = function(...args) {
        const msg = args.join(' ');
        if (msg.includes('social-connect') || msg.includes('gae2-spclient') || msg.includes('404')) return;
        origError.apply(console, args);
      };
    })();
  </script>
</head>
<body class="min-h-full flex flex-col">
  <main class="relative flex min-h-dvh flex-1 flex-col items-center justify-between overflow-hidden">
    
    <!-- Hero Background Image -->
    <div class="hero-bg fixed inset-0 -z-10 bg-black bg-cover bg-center bg-no-repeat">
      <div class="pointer-events-none absolute inset-0 bg-gradient-to-b from-black/10 via-transparent to-black/40"></div>
    </div>

    <!-- Top Left: Live Clock -->
    <div class="fixed left-5 top-5 z-20 text-sm font-medium tabular-nums text-white drop-shadow-[0_1px_6px_rgba(0,0,0,0.5)]">
      <span id="clock-hours">2</span><span class="animate-[blink_1s_step-end_infinite]">:</span><span id="clock-minutes">22</span><span id="clock-ampm" class="ml-1.5 text-white/70">am</span>
    </div>

    <!-- Top Center: Online Pulse Pill -->
    <div class="fixed left-1/2 top-5 z-20 -translate-x-1/2 inline-flex items-center gap-2 rounded-full py-1.5 pl-3 pr-4 text-sm font-medium text-white drop-shadow-[0_1px_6px_rgba(0,0,0,0.5)]" aria-live="polite">
      <span class="relative flex h-2.5 w-2.5">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-green-400 opacity-75"></span>
        <span class="relative inline-flex h-2.5 w-2.5 rounded-full bg-green-400 shadow-[0_0_8px_rgba(74,222,128,0.9)]"></span>
      </span>
      <span id="online-count" class="tabular-nums">36</span>
      <span class="text-white/70">online</span>
    </div>

    <!-- Top Right: Spotify Link Button -->
    <div class="fixed right-5 top-5 z-20 flex items-center gap-2">
      <a href="https://open.spotify.com/playlist/0XwQxGWur4iagqxaqDRx0G" target="_blank" rel="noopener noreferrer" 
         class="group/pill flex items-center gap-2 rounded-full text-sm font-medium text-white p-2.5 sm:py-2 sm:pl-3 sm:pr-3.5 drop-shadow-[0_1px_6px_rgba(0,0,0,0.5)] transition hover:opacity-80 active:scale-95" aria-label="Open on Spotify">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white" aria-hidden="true">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.42 1.56-.299.421-1.02.599-1.559.3z"></path>
        </svg>
        <span class="hidden sm:inline">Spotify</span>
        <span class="hidden sm:inline-flex">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="-rotate-45 opacity-50 transition group-hover/pill:opacity-90">
            <path d="M5 12h14M13 6l6 6-6 6"></path>
          </svg>
        </span>
      </a>
    </div>

    <!-- Center Hero Section: Mero Nepal Devanagari Transparent Logo -->
    <div class="mt-[14vh] flex flex-col items-center px-6">
      <h1>
        <img alt="मेरो नेपाल" width="930" height="627" class="h-auto w-[60vw] max-w-md drop-shadow-[0_4px_24px_rgba(0,0,0,0.6)]" src="ChatGPT Image Aug 11, 2026, 02_04_31 AM-Photoroom.png">
      </h1>
    </div>

    <!-- Bottom Audio Player Bar (Exact saloon.wtf Pill & Control Buttons) -->
    <div class="mb-[8vh] flex w-full justify-center px-6">
      <div class="w-full max-w-xl">
        <div class="group relative flex items-center gap-4 rounded-full p-3 pr-5 bg-white/10 backdrop-blur-2xl backdrop-saturate-150 border border-white/20 shadow-[0_8px_40px_rgba(0,0,0,0.45),inset_0_1px_0_rgba(255,255,255,0.25)]">
          
          <!-- Track Artwork Cover (Exact saloon.wtf spinning vinyl & center hole overlay) -->
          <div class="relative h-20 w-20 shrink-0 cursor-pointer" id="art-container">
            <div id="vinyl-cover" class="h-full w-full animate-[spin_8s_linear_infinite] overflow-hidden rounded-full shadow-lg ring-1 ring-white/20" style="animation-play-state: paused;">
              <img id="track-art" src="https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e0299a6ab5edff13abc12fccc06" alt="Single artwork" class="h-full w-full object-cover">
            </div>
            <div class="pointer-events-none absolute left-1/2 top-1/2 h-3 w-3 -translate-x-1/2 -translate-y-1/2 rounded-full bg-black/70 ring-2 ring-white/40"></div>
          </div>

          <!-- Track Info & Progress Bar -->
          <div class="flex flex-col min-w-0 flex-1">
            <h2 id="track-title" class="text-[15px] font-semibold text-white truncate drop-shadow-sm">
              Feri Jaalma (From "Feri Resham Filili")
            </h2>
            <p id="track-artist" class="text-[13px] font-medium text-white/70 truncate mt-0.5">
              Kali Prasad Baskota
            </p>

            <!-- Progress Bar Slider -->
            <div class="mt-2 flex items-center gap-2">
              <div class="relative flex-1 h-1 bg-white/20 rounded-full cursor-pointer overflow-hidden group/bar" id="progress-container">
                <div id="progress-bar" class="h-full bg-white rounded-full w-0 transition-all duration-150"></div>
              </div>
              <span id="time-display" class="text-[11px] font-medium text-white/60 tabular-nums">0:00 / 0:00</span>
            </div>
          </div>

          <!-- Player Controls (Exact saloon.wtf height, width & classes) -->
          <div class="flex items-center gap-1">
            <!-- Previous Track (grid h-9 w-9) -->
            <button id="btn-prev" type="button" aria-label="Previous track" class="grid h-9 w-9 place-items-center rounded-full text-white/80 transition hover:bg-white/15 hover:text-white active:scale-95 cursor-pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
              </svg>
            </button>

            <!-- Play / Pause Button (grid h-11 w-11) -->
            <button id="btn-play" type="button" aria-label="Play" aria-pressed="false" class="grid h-11 w-11 place-items-center rounded-full bg-white text-black shadow-lg transition hover:scale-105 active:scale-95 disabled:opacity-50 cursor-pointer">
              <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="ml-0.5">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="hidden">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
            </button>

            <!-- Next Track (grid h-9 w-9) -->
            <button id="btn-next" type="button" aria-label="Next track" class="grid h-9 w-9 place-items-center rounded-full text-white/80 transition hover:bg-white/15 hover:text-white active:scale-95 cursor-pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/>
              </svg>
            </button>
          </div>

        </div>
      </div>
    </div>

    <!-- Hidden YouTube Audio Engine (Guarantees Full Songs with No 30s Preview Limits) -->
    <div class="pointer-events-none absolute h-px w-px overflow-hidden opacity-0" aria-hidden="true">
      <div id="youtube-player"></div>
    </div>

  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
